name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Decode google-services.json if provided via Secret
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Copy APK to friendly filename
        run: cp app/build/outputs/apk/debug/app-debug.apk Heimboard-TV.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Heimboard-TV-APK
          path: Heimboard-TV.apk

      - name: Publish APK to GitHub Release (latest-tv-apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-tv-apk
          name: Heimboard Android TV APK
          body: Automatisch gebaute APK für Philips Google TV (Android 14, Landscape 16:9).
          files: Heimboard-TV.apk
          prerelease: false
          make_latest: true
